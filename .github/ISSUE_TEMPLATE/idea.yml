name: Suggest an idea
description: A function or a change that would help you.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would help you
      description: What you want to do with Bolometrix, and what is missing or in the way.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today (optional)
  - type: input
    id: setup
    attributes:
      label: Camera and set-up (optional)
      placeholder: "Xi 400 on a furnace door, a PLC over Modbus TCP"
